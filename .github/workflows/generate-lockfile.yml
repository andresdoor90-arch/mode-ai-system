name: Generate pnpm lockfile

# Generates a valid pnpm-lock.yaml on a networked runner and commits it to the
# repo root, next to package.json. The project was authored in an offline
# sandbox with no npm-registry access, so a valid lockfile (which needs to
# resolve the full dependency graph from the registry) could not be created
# there. Run this once (Actions tab -> "Generate pnpm lockfile" -> Run workflow,
# selecting this branch); afterwards the lockfile is committed and CI/Release
# can use it.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lockfile:
    name: Resolve & commit pnpm-lock.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve dependency graph into a lockfile
        # --lockfile-only resolves the full graph from the registry and writes
        # pnpm-lock.yaml without linking node_modules.
        run: pnpm install --lockfile-only

      - name: Commit lockfile to the branch
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add generated pnpm-lock.yaml"
            git push
            echo "Committed pnpm-lock.yaml."
          else
            echo "pnpm-lock.yaml already present and up to date — nothing to commit."
          fi
