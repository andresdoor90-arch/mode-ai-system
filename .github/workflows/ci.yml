name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.7.1
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # A pnpm-lock.yaml is not committed yet (the project was authored in an
        # offline sandbox without registry access). Until one is generated and
        # committed from a networked environment, do not require a frozen
        # lockfile — otherwise CI cannot install. Once committed, switch this
        # back to `--frozen-lockfile`.
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build:packages

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/coverage/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Build desktop app
        run: pnpm --filter @mas/desktop build

      - name: Upload desktop build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-out
          path: apps/desktop/out/
          if-no-files-found: ignore
          retention-days: 7
