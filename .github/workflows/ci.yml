name: CI

on:
  push:
    branches: [main, phase-8-polish-distribution]
  pull_request:
    branches: [main, phase-7-persistence-plugins]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.7.1
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache pnpm's content-addressable store manually, keyed on the
      # package.json files. This does NOT require a committed pnpm-lock.yaml.
      # `actions/setup-node` with `cache: pnpm` was removed on purpose: it
      # hard-fails ("Dependencies lock file is not found") when no lockfile is
      # present, which is the case here until one is generated on a runner.
      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        # No pnpm-lock.yaml is committed yet (the project was authored in an
        # offline sandbox with no registry access, so a valid lockfile could not
        # be generated there). `pnpm install` resolves and WRITES pnpm-lock.yaml
        # during this step on the networked runner. Once a lockfile is committed
        # to the repo root, switch this back to `--frozen-lockfile`.
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build:packages

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/coverage/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Build desktop app
        run: pnpm --filter @mas/desktop build

      - name: Upload desktop build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-out
          path: apps/desktop/out/
          if-no-files-found: ignore
          retention-days: 7
